<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>

    
/* Main inquiry form */
.inquiry-form-wrap {
  --inquiry-bg: #f2f0e5;
  --inquiry-text: #222222;
  --inquiry-button: #707183;

  max-width: 1070px;
  margin: 0 auto;
  padding: 28px 0 10px;
  color: var(--inquiry-text);
  font-family: inherit;
  box-sizing: border-box;
}

.inquiry-form-wrap *,
.inquiry-form-wrap *::before,
.inquiry-form-wrap *::after {
  box-sizing: border-box;
}

/* Heading */
.inquiry-form-wrap .inquiry-heading {
  margin: 0 0 66px;
  text-align: center;
  font-size: clamp(28px, 4.5vw, 56px);
  font-weight: 700;
  line-height: 0.99;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}

/* Fields */
.inquiry-form-wrap .inquiry-field {
  min-width: 0;
}

.inquiry-form-wrap .inquiry-field label {
  display: block;
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}

.inquiry-form-wrap .inquiry-field input:not([type="checkbox"]),
.inquiry-form-wrap .inquiry-field textarea {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 7px 0;
  border: 0;
  border-bottom: 1px solid #373737;
  border-radius: 0;
  outline: none;
  background: transparent;
  color: #222;
  font: inherit;
  font-size: 15px;
  box-shadow: none;
}

.inquiry-form-wrap .inquiry-field input:focus,
.inquiry-form-wrap .inquiry-field textarea:focus {
  border-bottom-color: #707183;
  box-shadow: 0 1px 0 #707183;
}

/* Full-width name field */
.inquiry-form-wrap .inquiry-full {
  margin-bottom: 40px;
}

/* Email and company */
.inquiry-form-wrap .inquiry-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  margin-bottom: 40px;
}

/* Country code and phone */
.inquiry-form-wrap .inquiry-phone-row {
  display: grid;
  grid-template-columns: 190px minmax(0, 495px);
  justify-content: center;
  gap: 80px;
  margin-bottom: 50px;
}

.inquiry-form-wrap .inquiry-country label {
  text-align: center;
}

.inquiry-form-wrap .inquiry-country input {
  text-align: center;
}

/* Requirements box */
.inquiry-form-wrap .inquiry-requirements {
  margin-bottom: 30px;
}

.inquiry-form-wrap .inquiry-requirements textarea {
  min-height: 150px;
  padding: 12px;
  border: 1px solid #373737;
  resize: vertical;
}

/* Consent and submit button */
.inquiry-form-wrap .inquiry-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 75px;
  margin-bottom: 32px;
}

.inquiry-form-wrap .inquiry-consents {
  flex: 0 1 350px;
  font-size: 11px;
  line-height: 1.7;
}

.inquiry-form-wrap .inquiry-consent {
  margin-bottom: 6px;
}

.inquiry-form-wrap .inquiry-consent .wpcf7-form-control-wrap {
  display: inline;
}

.inquiry-form-wrap .inquiry-consent .wpcf7-list-item {
  margin: 0;
}

.inquiry-form-wrap .inquiry-consent label {
  display: inline;
}

.inquiry-form-wrap .inquiry-consent input[type="checkbox"] {
  width: 11px;
  height: 11px;
  margin: 0 5px 0 0;
  vertical-align: baseline;
  accent-color: #707183;
}

.inquiry-form-wrap .inquiry-consent a {
  color: inherit;
  text-decoration: underline;
}

.inquiry-form-wrap .inquiry-submit {
  flex: 0 0 217px;
}

.inquiry-form-wrap .inquiry-submit input[type="submit"] {
  display: block;
  width: 100%;
  min-height: 50px;
  margin: 0;
  padding: 14px 18px;
  border: 0;
  border-radius: 0;
  background: var(--inquiry-button);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s ease;
}

.inquiry-form-wrap .inquiry-submit input[type="submit"]:hover {
  background: #555768;
}

/* Disclaimer */
.inquiry-form-wrap .inquiry-disclaimer {
  max-width: 900px;
  margin: 0 auto;
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: 0.015em;
}

/* CF7 validation */
.inquiry-form-wrap .wpcf7-not-valid-tip {
  margin-top: 5px;
  font-size: 12px;
}

.inquiry-form-wrap .wpcf7-response-output {
  margin: 20px 0 0;
  padding: 12px;
  font-size: 14px;
}

/* Tablet and mobile */
@media (max-width: 767px) {
  .inquiry-form-wrap {
    padding: 20px 18px;
  }

  .inquiry-form-wrap .inquiry-heading {
    margin-bottom: 40px;
    font-size: clamp(27px, 6vw, 40px);
    line-height: 1.05;
  }

  .inquiry-form-wrap .inquiry-row {
    grid-template-columns: 1fr;
    gap: 28px;
    margin-bottom: 28px;
  }

  .inquiry-form-wrap .inquiry-full {
    margin-bottom: 28px;
  }

  .inquiry-form-wrap .inquiry-phone-row {
    grid-template-columns: 110px minmax(0, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  .inquiry-form-wrap .inquiry-requirements {
    margin-bottom: 24px;
  }

  .inquiry-form-wrap .inquiry-requirements textarea {
    min-height: 140px;
  }

  .inquiry-form-wrap .inquiry-bottom {
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
    margin-bottom: 28px;
  }

  .inquiry-form-wrap .inquiry-consents {
    flex-basis: auto;
    font-size: 12px;
  }

  .inquiry-form-wrap .inquiry-submit {
    flex-basis: auto;
    width: 100%;
  }

  .inquiry-form-wrap .inquiry-disclaimer {
    font-size: 12px;
  }
}

  </style>
  
<div class="inquiry-form-wrap">

  <h2 class="inquiry-heading">
    FOR INQUIRIES,<br>
    PLEASE COMPLETE THIS FORM
  </h2>

  <form class="inquiry-html-form" action="#" method="post">

    <div class="inquiry-field inquiry-full">
      <label for="your-name">NAME *</label>
      <input type="text" id="your-name" name="your-name"
             autocomplete="name" required>
    </div>

    <div class="inquiry-row">
      <div class="inquiry-field">
        <label for="your-email">EMAIL *</label>
        <input type="email" id="your-email" name="your-email"
               autocomplete="email" required>
      </div>

      <div class="inquiry-field">
        <label for="company-name">COMPANY NAME *</label>
        <input type="text" id="company-name" name="company-name"
               required>
      </div>
    </div>

    <div class="inquiry-phone-row">
      <div class="inquiry-field inquiry-country">
        <label for="country-code">COUNTRY CODE *</label>
        <input type="text" id="country-code" name="country-code"
               placeholder="+91" required>
      </div>

      <div class="inquiry-field inquiry-phone">
        <label for="phone-number">PHONE NUMBER *</label>
        <input type="tel" id="phone-number" name="phone-number"
               autocomplete="tel-national" required>
      </div>
    </div>

    <div class="inquiry-field inquiry-requirements">
      <label for="your-requirements">YOUR REQUIREMENTS *</label>
      <textarea id="your-requirements" name="your-requirements"
                rows="6" required></textarea>
    </div>

    <div class="inquiry-bottom">
      <div class="inquiry-consents">

        <div class="inquiry-consent">
          <label for="privacy-agreement">
            <input type="checkbox" id="privacy-agreement"
                   name="privacy-agreement" value="yes" required>
            I have read and agree to the
            <a href="/privacy-policy/" target="_blank">
              Privacy Policy
            </a>.
          </label>
        </div>

        <div class="inquiry-consent">
          <label for="marketing-consent">
            <input type="checkbox" id="marketing-consent"
                   name="marketing-consent" value="yes">
            Yes, I would like to receive emails with exclusive specials and offers.
          </label>
        </div>

      </div>

      <div class="inquiry-submit">
        <button type="submit">SUBMIT INQUIRY</button>
      </div>
    </div>

    <p class="inquiry-disclaimer">
      By submitting this online form, you agree to be contacted via
      email, phone, or SMS by Signature Developers in relation to
      its products and your inquiry. We do not share your personal
      details with third parties.
    </p>

  </form>
</div>


</body>
</html>
