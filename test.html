<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinned Project Showcase</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2b2522;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Outer Section pinned by GSAP */
    .brand-showcase {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 4vw, 4rem) clamp(2rem, 5vw, 6rem);
      background-color: #2b2522;
      overflow: hidden;
    }

    /* Header Text (Aligned to top right) */
    .brand-showcase__header {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 2rem;
    }

    .brand-showcase__title {
      font-size: clamp(1.4rem, 2.5vw, 2.4rem);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      text-align: right;
      line-height: 1.25;
      max-width: 650px;
    }

    /* Main Two-Column Layout */
    .brand-showcase__body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex: 1;
      gap: clamp(2rem, 5vw, 5rem);
    }

    /* ================= Left Column ================= */
    .brand-showcase__left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      height: 100%;
      max-height: 520px;
      width: 320px;
      flex-shrink: 0;
    }

    /* Dynamic Logo Stack Area */
    .brand-showcase__logo-stage {
      position: relative;
      width: 200px;
      height: 200px;
      margin-top: auto;
      margin-bottom: auto;
    }

    .brand-showcase__logo-box {
      position: absolute;
      inset: 0;
      border: 2px solid #2093e5;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
    }

    .brand-showcase__logo-box.is-active {
      opacity: 1;
      visibility: visible;
    }

    .logo-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.4rem;
      color: #ffffff;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 0.3rem;
    }

    .logo-brand-name {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.22em;
    }

    .logo-brand-sub {
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      opacity: 0.75;
    }

    /* Dedicated Action Buttons Stage */
    .brand-showcase__btn-stage {
      position: relative;
      width: 100%;
      height: 48px;
      /* Holds the height so layout does not shift */
    }

    /* Individual Pill Buttons */
    .brand-showcase__btn {
      position: absolute;
      bottom: 0;
      left: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    .brand-showcase__btn.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .brand-showcase__btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }

    .brand-showcase__btn:hover {
      background: #ffffff;
      color: #2b2522;
      border-color: #ffffff;
    }

    .brand-showcase__btn:hover svg {
      transform: translate(2px, -2px);
    }

    /* ================= Right Column ================= */
    .brand-showcase__right {
      flex: 1;
      height: 100%;
      max-height: 540px;
      display: flex;
      align-items: center;
    }

    .brand-showcase__slides-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .brand-showcase__slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
    }

    .brand-showcase__slide.is-active {
      opacity: 1;
      visibility: visible;
    }

    .brand-showcase__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
    }

    /* Responsive adjustment */
    @media (max-width: 900px) {
      .brand-showcase {
        height: auto;
        min-height: 100vh;
        padding: 3rem 1.5rem;
      }

      .brand-showcase__header {
        justify-content: flex-start;
      }

      .brand-showcase__title {
        text-align: left;
      }

      .brand-showcase__body {
        flex-direction: column-reverse;
      }

      .brand-showcase__right {
        width: 100%;
        min-height: 340px;
      }

      .brand-showcase__left {
        width: 100%;
        align-items: center;
        gap: 1.5rem;
      }

      .brand-showcase__btn-stage {
        display: flex;
        justify-content: center;
      }

      .brand-showcase__btn {
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <!-- Pinned Scroll Section -->
  <section class="brand-showcase" id="brandShowcase">

    <!-- Top-Right Section Heading -->
    <header class="brand-showcase__header">
      <h2 class="brand-showcase__title">WEBSITES WE'VE BUILT FOR GROWING BRANDS</h2>
    </header>

    <div class="brand-showcase__body">

      <!-- LEFT COLUMN: Separate Logos & Dedicated Separate Action Buttons -->
      <div class="brand-showcase__left">

        <!-- Dynamic Logo Stage -->
        <div class="brand-showcase__logo-stage">

          <!-- Slide 1 Logo (Active) -->
          <div class="brand-showcase__logo-box is-active">
            <div class="logo-inner">
              <svg class="logo-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor">
                <path d="M20 5C14 12 14 18 20 20C26 22 26 28 20 35" stroke-width="2" stroke-linecap="round" />
                <path d="M23 7C19 13 19 17 23 19C27 21 27 26 23 33" stroke-width="1.5" stroke-linecap="round"
                  opacity="0.6" />
              </svg>
              <span class="logo-brand-name">SIGNATURE</span>
              <span class="logo-brand-sub">DEVELOPERS</span>
            </div>
          </div>

          <!-- Slide 2 Logo -->
          <div class="brand-showcase__logo-box">
            <div class="logo-inner">
              <svg class="logo-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor">
                <polygon points="20 6, 34 32, 6 32" stroke-width="2" />
              </svg>
              <span class="logo-brand-name">VERTEX</span>
              <span class="logo-brand-sub">ESTATES</span>
            </div>
          </div>

          <!-- Slide 3 Logo -->
          <div class="brand-showcase__logo-box">
            <div class="logo-inner">
              <svg class="logo-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor">
                <circle cx="20" cy="20" r="14" stroke-width="2" />
                <path d="M12 20h16M20 12v16" stroke-width="1.5" />
              </svg>
              <span class="logo-brand-name">LUMEN</span>
              <span class="logo-brand-sub">STUDIOS</span>
            </div>
          </div>

        </div>

        <!-- Separate Action Buttons Container -->
        <div class="brand-showcase__btn-stage">

          <!-- Button 1 (Active) -->
          <a href="#signature-case-study" class="brand-showcase__btn is-active">
            <span>SEE WHAT WE'VE CREATED</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>

          <!-- Button 2 -->
          <a href="#vertex-case-study" class="brand-showcase__btn">
            <span>EXPLORE RESIDENTIAL VILLA</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>

          <!-- Button 3 -->
          <a href="#lumen-case-study" class="brand-showcase__btn">
            <span>VIEW BESPOKE PORTFOLIO</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>

        </div>

      </div>

      <!-- RIGHT COLUMN: Pinned Project Visual Cards -->
      <div class="brand-showcase__right">
        <div class="brand-showcase__slides-container">

          <!-- Project Slide 1 -->
          <article class="brand-showcase__slide is-active">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80"
              alt="Signature Developers Villa">
          </article>

          <!-- Project Slide 2 -->
          <article class="brand-showcase__slide">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=80"
              alt="Vertex Estates Luxury Modern Home">
          </article>

          <!-- Project Slide 3 -->
          <article class="brand-showcase__slide">
            <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=80"
              alt="Lumen Studios Architecture">
          </article>

        </div>
      </div>

    </div>
  </section>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const slides = document.querySelectorAll('.brand-showcase__slide');
    const logos = document.querySelectorAll('.brand-showcase__logo-box');
    const buttons = document.querySelectorAll('.brand-showcase__btn');
    const totalSlides = slides.length;

    let currentIdx = 0;

    // Dynamic pin distance based on slide count
    const pinDistance = window.innerHeight * totalSlides;

    gsap.timeline({
      scrollTrigger: {
        trigger: '#brandShowcase',
        start: 'top top',
        end: `+=${pinDistance}`,
        pin: true,
        scrub: 1, // Smooth scrub
        onUpdate: (self) => {
          // Calculate current slide step from progress (0 to 1)
          const targetIdx = Math.min(
            Math.floor(self.progress * totalSlides),
            totalSlides - 1
          );

          if (targetIdx !== currentIdx) {
            switchProject(targetIdx, targetIdx > currentIdx ? 'down' : 'up');
          }
        }
      }
    });

    function switchProject(newIdx, direction) {
      const prevSlide = slides[currentIdx];
      const nextSlide = slides[newIdx];

      const prevLogo = logos[currentIdx];
      const nextLogo = logos[newIdx];

      const prevBtn = buttons[currentIdx];
      const nextBtn = buttons[newIdx];

      const yMove = direction === 'down' ? 20 : -20;

      // 1. Image Slide Transition
      gsap.to(prevSlide, {
        opacity: 0,
        duration: 0.5,
        ease: 'power2.inOut',
        onComplete: () => {
          prevSlide.classList.remove('is-active');
          gsap.set(prevSlide, { visibility: 'hidden' });
        }
      });

      gsap.set(nextSlide, { visibility: 'visible' });
      nextSlide.classList.add('is-active');
      gsap.fromTo(
        nextSlide,
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: 'power2.out' }
      );

      const nextImg = nextSlide.querySelector('img');
      gsap.fromTo(
        nextImg,
        { scale: 1.1 },
        { scale: 1.04, duration: 1, ease: 'power2.out' }
      );

      // 2. Logo Transition
      gsap.to(prevLogo, {
        opacity: 0,
        y: -yMove,
        duration: 0.35,
        ease: 'power2.in',
        onComplete: () => {
          prevLogo.classList.remove('is-active');
          gsap.set(prevLogo, { visibility: 'hidden' });
        }
      });

      gsap.set(nextLogo, { visibility: 'visible' });
      nextLogo.classList.add('is-active');
      gsap.fromTo(
        nextLogo,
        { opacity: 0, y: yMove },
        { opacity: 1, y: 0, duration: 0.5, delay: 0.08, ease: 'power2.out' }
      );

      // 3. Separate Button Transition
      gsap.to(prevBtn, {
        opacity: 0,
        y: -yMove,
        duration: 0.3,
        ease: 'power2.in',
        onComplete: () => {
          prevBtn.classList.remove('is-active');
          gsap.set(prevBtn, { visibility: 'hidden' });
        }
      });

      gsap.set(nextBtn, { visibility: 'visible' });
      nextBtn.classList.add('is-active');
      gsap.fromTo(
        nextBtn,
        { opacity: 0, y: yMove },
        { opacity: 1, y: 0, duration: 0.45, delay: 0.12, ease: 'power2.out' }
      );

      currentIdx = newIdx;
    }
  </script>
</body>

</html>
